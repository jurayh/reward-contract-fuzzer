name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with the gymnasium extra
        run: pip install '.[gymnasium]'
      - name: Package tests (corpora + adapters)
        run: python tests/test_v01.py
      - name: Spike regression suite
        run: python tests/test_spike.py
      - name: Demo audit smoke test (sensor farm must flag, exit 1)
        run: |
          set +e
          python -m rcfuzz.cli audit examples/sensor-farm/contract.json > /tmp/report.md
          code=$?
          set -e
          test $code -eq 1
          grep -q "EXPLOIT FOUND" /tmp/report.md
