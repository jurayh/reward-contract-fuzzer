[project]
name = "reward-contract-fuzzer"
version = "0.1.0"
description = "Find the policy your reward function actually incentivizes, before an agent does. Optimizer-proved reward contract testing for RL environments."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuriy H" }]

[project.scripts]
rcfuzz = "rcfuzz.cli:main"

[project.optional-dependencies]
gymnasium = ["gymnasium>=0.29"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rcfuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
